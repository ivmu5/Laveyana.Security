name: Nightly Extended Regression

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-tests:
    name: Nightly repeated tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public API layout, braces and enum docs
        run: python tools/verify_api_layout.py
      - name: Restore and build
        shell: bash
        run: |
          dotnet restore Laveyana.Security.sln --locked-mode
          dotnet build Laveyana.Security.sln --no-restore -c Release -warnaserror
      - name: Repeat complete test suites three times
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            mkdir -p "artifacts/nightly/round-$round/unit" "artifacts/nightly/round-$round/integration"
            dotnet test tests/Laveyana.Security.Tests/Laveyana.Security.Tests.csproj --no-build --no-restore -c Release --logger "trx;LogFileName=unit-$round.trx" --results-directory "artifacts/nightly/round-$round/unit"
            dotnet test tests/Laveyana.Security.IntegrationTests/Laveyana.Security.IntegrationTests.csproj --no-build --no-restore -c Release --logger "trx;LogFileName=integration-$round.trx" --results-directory "artifacts/nightly/round-$round/integration"
          done
      - name: Check all platform test runs
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            python tools/check_trx.py --platform "${{ matrix.platform }}" --results-dir "artifacts/nightly/round-$round"
          done
      - name: Publish nightly test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-trx-${{ matrix.platform }}
          path: artifacts/nightly/**/*.trx
          if-no-files-found: warn
          retention-days: 14

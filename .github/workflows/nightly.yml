name: Extended Regression

# Scheduled runs execute on the default branch only.
# Manual runs become available once this file is merged into the default branch.
on:
  schedule:
    - cron: '17 2 1 * *' # First day of each month at 02:17 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repeat-nunit:
    name: Regression NUnit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'

      - name: Set up Python for TRX validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify SDK
        run: dotnet --info

      - name: Restore with locked dependencies
        run: dotnet restore Laveyana.Security.sln --locked-mode

      - name: Build Release (warnings as errors)
        run: dotnet build Laveyana.Security.sln --no-restore -c Release -warnaserror

      - name: Repeat unit and integration suites five times
        shell: pwsh
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          # Nonzero native exit codes are checked explicitly so all five attempts run.
          $PSNativeCommandUseErrorActionPreference = $false
          $anyFailed = $false
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Regression NUnit ($env:TEST_PLATFORM)"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "`n| Attempt | Result |`n| --- | --- |"
          }
          foreach ($attempt in 1..5) {
            $results = "artifacts/regression/attempt-$attempt"
            Write-Host "===== Attempt $attempt / 5 ($env:TEST_PLATFORM) ====="
            $failed = $false

            # Keep separate TRX files for every suite and repetition.
            dotnet test tests/Laveyana.Security.Tests/Laveyana.Security.Tests.csproj `
              --no-build --no-restore -c Release `
              --logger 'trx;LogFileName=unit.trx' `
              --results-directory "$results/unit"
            if ($LASTEXITCODE -ne 0) { $failed = $true }

            dotnet test tests/Laveyana.Security.IntegrationTests/Laveyana.Security.IntegrationTests.csproj `
              --no-build --no-restore -c Release `
              --logger 'trx;LogFileName=integration.trx' `
              --results-directory "$results/integration"
            if ($LASTEXITCODE -ne 0) { $failed = $true }

            # Fail if either project did not produce its own test report.
            foreach ($expected in @("$results/unit/unit.trx", "$results/integration/integration.trx")) {
              if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
                Write-Warning "Missing test report: $expected"
                $failed = $true
              }
            }

            # Validate each attempt in isolation, including OS-specific passing tests.
            python tools/check_trx.py --platform $env:TEST_PLATFORM --results-dir $results
            if ($LASTEXITCODE -ne 0) { $failed = $true }

            $outcome = if ($failed) { 'FAILED' } else { 'PASSED' }
            Write-Host "Attempt $attempt $outcome"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "| $attempt | $outcome |"
            }
            if ($failed) { $anyFailed = $true }
          }

          if ($anyFailed) {
            Write-Error 'At least one of five regression test attempts failed.'
            exit 1
          }
          Write-Host 'All five regression test attempts passed.'

      - name: Upload per-attempt TRX reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-trx-${{ matrix.platform }}
          path: artifacts/regression/**/*.trx
          if-no-files-found: warn
          retention-days: 14

name: Verify

on:
  # Pull requests verify topic branches; after merge, verify master again.
  # Avoid duplicating the same checks for both push and pull_request on topic branches.
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  changes:
    name: Native dependency scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      android: ${{ steps.detect.outputs.android }}
      apple: ${{ steps.detect.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect native dependency changes
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: python3 tools/native_dependency_scope.py

  android-native:
    name: Native Android compile
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update
      - name: Restore Android project
        run: dotnet restore platforms/android/Laveyana.Security.Maui.Android/Laveyana.Security.Maui.Android.csproj --force-evaluate
      - name: Build Android project
        run: dotnet build platforms/android/Laveyana.Security.Maui.Android/Laveyana.Security.Maui.Android.csproj -c Release --no-restore -warnaserror
  apple-native:
    name: Native Apple compile
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Apple workloads
        run: dotnet workload install ios maccatalyst --skip-manifest-update
      - name: Restore Apple project
        run: dotnet restore platforms/apple/Laveyana.Security.Maui.Apple/Laveyana.Security.Maui.Apple.csproj --force-evaluate
      - name: Build Apple project
        run: dotnet build platforms/apple/Laveyana.Security.Maui.Apple/Laveyana.Security.Maui.Apple.csproj -c Release --no-restore -warnaserror
  source-checks:
    name: Source & docs
    needs: [changes, android-native, apple-native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify required native build results
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          ANDROID_NEEDED: ${{ needs.changes.outputs.android }}
          APPLE_NEEDED: ${{ needs.changes.outputs.apple }}
          ANDROID_RESULT: ${{ needs.android-native.result }}
          APPLE_RESULT: ${{ needs.apple-native.result }}
        shell: bash
        run: |
          if [[ "$SCOPE_RESULT" != "success" ]]; then echo "Native scope failed"; exit 1; fi
          if [[ "$ANDROID_NEEDED" == "true" && "$ANDROID_RESULT" != "success" ]]; then
            echo "Android native compilation did not succeed: $ANDROID_RESULT"; exit 1
          fi
          if [[ "$APPLE_NEEDED" == "true" && "$APPLE_RESULT" != "success" ]]; then
            echo "Apple native compilation did not succeed: $APPLE_RESULT"; exit 1
          fi
          if [[ "$ANDROID_NEEDED" != "true" && "$ANDROID_RESULT" != "skipped" ]]; then
            echo "Unexpected Android native result: $ANDROID_RESULT"; exit 1
          fi
          if [[ "$APPLE_NEEDED" != "true" && "$APPLE_RESULT" != "skipped" ]]; then
            echo "Unexpected Apple native result: $APPLE_RESULT"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository conventions
        run: python tools/verify_repository.py
      - name: Native dependency detector regressions
        run: python -m unittest discover -s tools -p test_native_dependency_scope.py
      - name: Public API layout, braces and enum docs
        run: python tools/verify_api_layout.py
      - name: Repository checker self-test
        run: python tools/verify_repository.py --self-test
      - name: Documentation consistency
        run: python tools/verify_documentation.py
      - name: Documentation checker self-test
        run: python tools/verify_documentation.py --self-test
  build-and-test:
    name: Build & NUnit (${{ matrix.os }})
    needs: source-checks
    # Avoid transitive skip from optional native jobs even when Source & docs succeeded.
    if: always() && needs.source-checks.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show SDK
        run: dotnet --info
      - name: Restore locked dependency graph
        run: dotnet restore Laveyana.Security.sln --locked-mode
      - name: Release build with warnings as errors
        run: dotnet build Laveyana.Security.sln --no-restore -c Release -warnaserror
      - name: Unit tests (TRX)
        run: dotnet test tests/Laveyana.Security.Tests/Laveyana.Security.Tests.csproj --no-build --no-restore -c Release --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results/unit
      - name: Integration tests (TRX)
        run: dotnet test tests/Laveyana.Security.IntegrationTests/Laveyana.Security.IntegrationTests.csproj --no-build --no-restore -c Release --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results/integration
      - name: Ensure platform tests actually passed
        run: python tools/check_trx.py --platform ${{ matrix.platform }} --results-dir artifacts/test-results
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-${{ matrix.platform }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14
